function dueBit(m){if(!m.due||!nxt(m))return'';const n=left(m.due);

function phases(m){const n=nxt(m);const auto=n?n.ph:PHASES.length-1;const sel=curPh==null?auto:curPh;
 const tot=cnt(m),tp=Math.round(tot/S.length*100);

 const chart=`<section class="card prog"><div class="pgh"><h3>${esc(label(m.id))} Aylık Rapor</h3><span><b>%${tp}</b> · ${tot}/${S.length} adım</span></div>

 return chart+PHASES.map((_,i)=>i).map(i=>{const P=PHASES[i];const st=S.filter(s=>s.ph===i);const dn=st.filter(s=>m.done[s.id]).length;
 return `<section class="card phase" id="faz-${i+1}"><div class="ph"><h3>Faz ${i+1} · ${esc(P.t)}</h3><span>${esc(P.w)} · ${dn}/${st.length}</span></div>`+
 st.map(s=>{const d=m.done[s.id];const isCur=n&&n.id===s.id;

  <div class="t">${s.t.includes('{ay}')?'':`<span class="ay">${esc(label(m.id))}</span>`}${esc(tt(s,m))}${s.h?`<small>${esc(s.h)}</small>`:''}${!d&&s.w?`<small class="wait">Karşı taraf bekleniyor</small>`:''}${s.id==='s6'&&!isCur?msgBox(m,0):''}${s.id==='s19'&&!d?follow(m):''}</div>
  <div class="r"><span class="tag pl">${esc(PLACE[s.p])}</span>${d?`<span>${esc(fmt(d))}</span>`:(n&&S.indexOf(s)>S.indexOf(n)?`<button class="upto" data-act="upto" data-s="${s.id}">buraya kadar tamam</button>`:'')}</div></div>`+
  (s.ms&&d?`<div class="ms">${esc(s.ms)}</div>`:'')}).join('')+`</section>`}).join('')}
