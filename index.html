<style data-own>
/* VOICE: kurumsal, sade, güven veren — Emay Yönetim Sistemi (EYS) ile aynı aile.
   IDEA: EYS giriş ekranı: gece laciverti üst bant + beyaz kurumsal kart.
   PICTURE: lacivert bantta açık ayların cam kartları; altta beyaz "sıradaki adım" kartı ve ince ilerleme çubuğu.
   COLOUR/TYPE: lacivert #0d1828, EYS kırmızısı #dc2f2f, açık gri zemin #f3f5f8; Outfit başlık + Inter metin.
   LAYOUT: koyu üst bant (başlık + ay kartları), açık gövde (kart, ilerleme, adımlar, notlar). */
:root{color-scheme:light dark;
--bg:light-dark(#f3f5f8,#0a1320);--card:light-dark(#ffffff,#111d2e);--ink:light-dark(#111a2b,#e8edf4);--mute:light-dark(#5d6878,#93a0b3);
--rule:light-dark(#e2e7ee,#22314a);--soft:light-dark(#eef2f7,#17253a);--navy:light-dark(#1a2a44,#c9d4e5);--red:#dc2f2f;--redt:light-dark(#d32a2a,#ff6b63);
--field:light-dark(#eaf1fb,#16243a);--fieldb:light-dark(#cfdae8,#2a3c58);--warn:light-dark(#c0392b,#ff8a7a);--ok:light-dark(#1f8a4c,#4cc985);
--shadow:0 1px 2px rgba(13,24,40,.06),0 12px 32px rgba(13,24,40,.08)}
:root[data-theme=light]{color-scheme:light}html{overflow-anchor:none}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Outfit,Inter,sans-serif;font-weight:700;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 max(4vw,16px)}
header{color:#fff;padding:34px 0 30px;background:radial-gradient(900px 380px at 78% 10%,rgba(92,124,178,.28),transparent 70%),radial-gradient(600px 300px at 10% 100%,rgba(220,47,47,.10),transparent 70%),linear-gradient(160deg,#0b1524 0%,#13223a 60%,#0d1828 100%)}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
.ttl{border-left:3px solid var(--red);padding-left:18px}
.eb{font-size:12px;font-weight:600;letter-spacing:.22em;color:#aab6c8;margin-bottom:10px}
h1{font-size:clamp(30px,5vw,46px)}h1 em{font-style:normal;color:#ff3b35}
.lead{color:#c3ccd9;margin:10px 0 0;max-width:52ch}
#sync{font-size:13px;color:#aab6c8;display:flex;align-items:center;gap:6px}
#sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
#sync.busy::before{background:#ffb020}#sync.bad::before{background:#ff6b63}
.lbl{font-size:12px;font-weight:600;letter-spacing:.18em;color:#93a0b3;margin:30px 0 12px}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.mc{border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:16px 18px;text-align:left;background:rgba(255,255,255,.05);color:#fff;display:grid;gap:9px;min-height:44px;backdrop-filter:blur(4px)}
.mc:hover{background:rgba(255,255,255,.08)}
.mc.on{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red);background:rgba(255,255,255,.08)}
.mc h3{font-size:22px;font-weight:600}
.mc .nx{font-size:14px;line-height:1.4;color:#d5dce7}.mc .nx b{font-weight:600;color:#fff}
.bar{height:4px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red)}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:#a7b3c5;align-items:center}
.mc .tag{background:rgba(255,255,255,.1);color:#fff}
.late{color:#ff7b72;font-weight:600}
.add{border-style:dashed;place-content:center;text-align:center;color:#fff;font-weight:600;background:transparent}
.add span{color:#ff3b35}
.arch{display:flex;flex-wrap:wrap;gap:8px}
.arch button{border:1px solid rgba(255,255,255,.18);background:transparent;color:#d5dce7;border-radius:99px;padding:8px 14px;min-height:40px;font-size:14px}
.arch button.on{border-color:var(--red);color:#fff}
.now{margin-top:-1px;margin-top:28px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:clamp(22px,3.5vw,36px);display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px}
.now .k{font-size:13px;color:var(--mute)}
.now h2{font-size:clamp(26px,4vw,38px);margin:10px 0 10px;color:var(--ink)}
.now .hint{color:var(--mute);margin:0 0 16px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--navy);white-space:nowrap}
.go{background:var(--red);color:#fff;border:0;border-radius:8px;padding:13px 24px;font-weight:600;min-height:50px;display:inline-flex;gap:10px;align-items:center;box-shadow:0 6px 18px rgba(220,47,47,.25)}
.go:hover{background:#c92626}
.side{border-left:1px solid var(--rule);padding-left:28px;display:grid;gap:18px;align-content:start}
.side label{font-size:14px;font-weight:500;display:block;margin-bottom:6px}
.side input{font:16px Inter,sans-serif;padding:10px 12px;border-radius:8px;border:1px solid var(--fieldb);background:var(--field);color:var(--ink);width:100%;max-width:240px;min-height:46px}
.big{font-family:Outfit,Inter,sans-serif;font-weight:700;font-size:36px;line-height:1}
.bigs{font-size:13px;color:var(--mute)}
.done-panel h2{margin-bottom:4px}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:clamp(18px,3vw,28px);margin-top:20px}
.phase{margin-top:20px}
.ph{display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-bottom:1px solid var(--rule);padding-bottom:10px}
.ph h3{font-size:20px;font-weight:600}.ph span{font-size:13px;color:var(--mute)}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule)}
.row.cur{background:var(--soft);margin:0 -12px;padding:10px 12px;border-radius:10px;border-bottom-color:transparent;box-shadow:inset 3px 0 0 var(--red)}
.ck{width:40px;height:40px;border-radius:8px;border:1.5px solid var(--fieldb);background:var(--card);display:grid;place-items:center;padding:0}
.ck svg{width:20px;height:20px;opacity:0}
.row.d .ck{background:var(--navy);border-color:var(--navy)}.row.d .ck svg{opacity:1}
:root .row.d .ck svg path{stroke:var(--card)}
.row.d .t{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--fieldb)}
.t{font-weight:500}.t small{display:block;font-weight:400;color:var(--mute);font-size:13px}
.r{display:flex;flex-direction:column;align-items:end;gap:4px;font-size:13px;color:var(--mute);text-align:right}
.upto{border:0;background:none;color:var(--redt);font-size:13px;padding:6px 0}
.upto:hover{text-decoration:underline}
.ms{font-size:13px;font-weight:600;color:var(--ok);padding:8px 0 0 54px}
.wait{color:var(--warn);font-weight:600}
textarea{width:100%;min-height:110px;font:16px/1.5 Inter,sans-serif;padding:12px;border:1px solid var(--fieldb);border-radius:8px;background:var(--field);color:var(--ink);resize:vertical}
.foot{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin:22px 0 48px}
.ghost{border:1px solid var(--fieldb);background:var(--card);border-radius:8px;padding:10px 16px;min-height:44px}
.ghost.danger{color:var(--warn);border-color:var(--warn);background:transparent}
.pgh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.pgh h3{font-size:20px;font-weight:600}.pgh span{font-size:14px;color:var(--mute);white-space:nowrap}.pgh b{color:var(--ink);font-weight:600}
.trk{display:flex;gap:4px;height:10px}
.seg{background:var(--soft);border-radius:5px;overflow:hidden;display:block}
.seg i{display:block;height:100%;background:var(--red);border-radius:5px}.seg i.ok{background:var(--ok)}
.lgd{display:flex;gap:4px;margin-top:8px}
.lg{border:0;background:none;text-align:left;padding:6px 0 0;min-height:44px;display:flex;flex-direction:column;gap:1px;border-top:2px solid transparent}
.lg.on{border-top-color:var(--red)}
.lgt{font-size:14px;font-weight:600}.lg:not(.on) .lgt{color:var(--mute);font-weight:500}
.lgn{font-size:13px;color:var(--mute)}
@media(max-width:600px){.lg{flex:1 1 0!important}.lgt{font-size:13px}}
@media(prefers-reduced-motion:no-preference){.seg i,.bar i{transition:width .4s ease}.ck{transition:background .15s}}
.congrats{background:var(--ok);color:#fff;text-align:center;font-weight:500;padding:14px 16px;font-size:16px}
.congrats b{font-family:Outfit,Inter,sans-serif;font-weight:700;font-size:19px;margin-right:6px}
.sg{font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--mute);padding:20px 0 6px;border-bottom:1px solid var(--rule)}
.ay{display:block;font-size:12px;font-weight:600;color:var(--redt);line-height:1.3}
.row.d .ay{color:var(--mute)}
.grp{font-weight:600;font-size:15px;padding:14px 0 6px;display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--rule)}
.grp span{font-weight:400;font-size:13px;color:var(--mute)}
.row.sub{padding-left:28px}.row.sub.cur{padding-left:40px}
@media(max-width:600px){.row.sub{padding-left:14px}.row.sub.cur{padding-left:26px}}
.msg{margin:10px 0 4px;display:grid;gap:8px}
.msg textarea{min-height:0;font-size:15px;font-weight:400}
.msg.dk{margin:0 0 18px}
.mrow{display:flex;flex-wrap:wrap;gap:8px}.mrow .ghost{font-size:14px;font-weight:600;text-decoration:none;color:var(--navy);display:inline-flex;align-items:center}

 <div class="padd"><input id="f_pnew" list="f_pl" placeholder="Kişi adı, örn. Dilek Özden" autocomplete="off"><datalist id="f_pl">${allPeople().map(n=>`<option value="${esc(n)}">`).join('')}</datalist><button type="button" class="ghost" data-act="padd">+ İlgili kişi ekle</button></div>
 <div class="dbtn">${isNew?'':`<button type="button" class="ghost danger" data-act="sdel">${confirmStep===s.id?'Emin misin? Sil':'Adımı sil'}</button>`}<span></span><button type="button" class="ghost" data-act="dclose">Vazgeç</button><button type="submit" class="go">Kaydet</button></div></form></div>`}
const mbar=m=>{if(editMode)return ebar();const n=m&&nxt(m);if(!n)return'';return `<div class="mbar"><div class="mt">${esc(label(m.id))} · sıradaki adım<b>${esc(tt(n,m))}</b></div><button class="go" data-act="tick" data-s="${n.id}">${n.w?'Geldi':'Tamamlandı'}</button></div>`};
const GRIP='<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>';
const own=()=>{if(!Array.isArray(state.steps)||!state.steps.length)state.steps=DEFAULT.map(o=>({...o}));return state.steps};
const strip=o=>({id:o.id,g:o.g,t:o.t,p:o.p,h:o.h||'',w:!!o.w,ms:o.ms||'',lv:o.lv|0,pp:ppl(o).slice(),free:!!o.free});
const placeInGroup=(list,o)=>{let k=-1;list.forEach((x,i)=>{if(x.g<=o.g)k=i});list.splice(k+1,0,o)};
function render(){const anc=app.firstChild?captureAnchor():null;pickCur();const m=state.months.find(x=>x.id===cur);
 const op=open(),cl=closed();
 const cg=m&&!nxt(m)?`<div class="congrats" role="status"><b>Tebrikler!</b> ${esc(label(m.id))} aylık raporu tamamlandı.</div>`:'';
 app.innerHTML=cg+`<header><div class="wrap"><div class="top"><div class="ttl"><div class="eb">EMAY YÖNETİM SİSTEMİ</div><h1>Aylık Rapor <em>Takibi</em></h1><p class="lead">Hangi ayın raporu, hangi adımda, hangi katta — tek bakışta.</p></div><div id="sync">Hazır</div></div>
 <div class="lbl">AÇIK AYLAR</div><div class="months">${op.map(card).join('')}<button class="mc add" data-act="add"><span>+</span> ${esc(label(nextId((state.months[state.months.length-1]||{id:iso(new Date()).slice(0,7)}).id)))} raporunu başlat</button></div>
 ${cl.length?`<div class="lbl">BİTEN AYLAR</div><div class="arch">${cl.map(x=>`<button class="${x.id===cur?'on':''}" data-act="sel" data-id="${esc(x.id)}">${esc(label(x.id))}</button>`).join('')}</div>`:''}</div></header>
 <main class="wrap"> ${m?nowPanel(m)+phases(m)+`<section class="card phase"><div class="ph"><h3>Notlar</h3><span>${esc(label(m.id))}</span></div>
 <p class="note-s">Kime ne zaman teslim ettin, kimden imza bekliyorsun…</p><textarea id="note" style="margin-top:8px">${esc(m.note||'')}</textarea></section>
 <div class="foot"><span class="note-s">Bir adımı geri almak için kutusuna tekrar dokun.</span><button class="ghost danger" data-act="del" data-id="${esc(m.id)}">${confirmDel===m.id?'Emin misin? '+esc(label(m.id))+' silinsin':esc(label(m.id))+' kaydını sil'}</button></div>`:'<p>Başlamak için bir ay ekle.</p>'}</main>`+mbar(m)+dialog(m)+cg;
 setSync(syncText,syncCls);restoreAnchor(anc);anchorId=null;uiSave()}
let syncText='Hazır',syncCls='';
function setSync(t,c){syncText=t;syncCls=c||'';const e=document.getElementById('sync');if(e){e.textContent=t;e.className=syncCls}}
function buildDoc(){const head=[...document.head.querySelectorAll('[data-own]')].map(e=>e.outerHTML).join('\n');
 const json=JSON.stringify(state).replace(/</g,'\\u003c');
 return '<!DOCTYPE html>\n<html lang="tr">\n<head>\n'+head+'\n</head>\n<body>\n<div id="app"></div>\n<script data-own type="application/json" id="state">'+json+'<\/script>\n'+document.getElementById('appjs').outerHTML+'\n</body>\n</html>'}
async function push(){timer=null;if(dlg||drag||(document.activeElement&&document.activeElement.id==='note')){timer=setTimeout(push,1500);return}uiSave();try{await art.publish(buildDoc());setSync('Kaydedildi')}catch(e){const c=String((e&&(e.code||e.message))||e);
 if(/not_granted|not_writer/.test(c))setSync('Salt okunur — değişiklik kaydedilmez','bad');else if(!/conflict/.test(c))setSync('Kaydedilemedi, tekrar dene','bad')}}
function save(){state.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
 if(art){setSync('Kaydediliyor…','busy');clearTimeout(timer);timer=setTimeout(push,1500)}else setSync('Bu cihazda kayıtlı')}
app.addEventListener('click',e=>{if(Date.now()<noClickUntil){e.preventDefault();e.stopPropagation();return}{const rw=e.target.closest('.row[data-sid]');anchorId=rw?rw.dataset.sid:null}const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;const m=state.months.find(x=>x.id===cur);
 if(a==='padd'){addPerson();return}
 if(a==='prm'){b.closest('.chip').remove();return}
 if(a==='dclose'){if(b.classList.contains('dlgbg')&&e.target!==b)return;dlg=null;confirmStep=null;render();return}
 if(a==='emode'){editMode=true;confirmReset=false;render();return}
 if(a==='edone'){editMode=false;dlg=null;confirmReset=false;chosen.clear();confirmBulk=false;render();return}
 if(a==='slink'){const list=own().map(strip);const o=list.find(x=>x.id===b.dataset.s);if(o){o.free=!o.free;state.steps=list;syncSteps();save();render()}return}
 if(a==='bfree'||a==='blink'){const v=a==='bfree';const list=own().map(strip);list.forEach(x=>{if(chosen.has(x.id))x.free=v});state.steps=list;chosen.clear();syncSteps();save();render();return}
 if(a==='ssel'){const id=b.dataset.s;chosen.has(id)?chosen.delete(id):chosen.add(id);confirmBulk=false;render();return}
 if(a==='bclear'){chosen.clear();confirmBulk=false;render();return}
 if(a==='bmove'){const g=+(document.getElementById('bulkg')||{}).value||0;const list=own().map(strip);const picked=list.filter(x=>chosen.has(x.id)).map(x=>({...x,g}));const rest=list.filter(x=>!chosen.has(x.id));picked.forEach(o=>placeInGroup(rest,o));state.steps=rest;chosen.clear();confirmBulk=false;syncSteps();save();render();return}
 if(a==='bdel'){if(confirmBulk){state.steps=own().filter(x=>!chosen.has(x.id));chosen.clear();confirmBulk=false;syncSteps();save();render()}else{confirmBulk=true;render()}return}
 if(a==='sedit'){dlg=b.dataset.s;confirmStep=null;render();const f=document.getElementById('f_t');if(f)f.focus();return}
 if(a==='sadd'){dlg='new';confirmStep=null;render();const f=document.getElementById('f_t');if(f)f.focus();return}
 if(a==='sdel'){if(confirmStep===dlg){state.steps=own().filter(x=>x.id!==dlg);dlg=null;confirmStep=null;syncSteps();save();render()}else{confirmStep=dlg;render()}return}
 if(a==='sreset'){if(confirmReset){delete state.steps;chosen.clear();confirmReset=false;syncSteps();save();render()}else{confirmReset=true;render()}return}
 if(a!=='del')confirmDel=null;
 if(a==='ph'){const el=document.getElementById('faz-'+(+b.dataset.i+1));if(el)el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});return}
 if(a==='sel'){cur=b.dataset.id;curPh=null;try{localStorage.setItem(KEY+'-cur',cur)}catch(e){}render();return}
 if(a==='add'){const last=state.months[state.months.length-1];const id=last?nextId(last.id):iso(new Date()).slice(0,7);
  state.months.push({id,due:defDue(id),done:{},note:''});cur=id;save();render();return}
 if(a==='editnum'){editNum=true;render();const i=document.getElementById('dnum');if(i)i.focus();return}
 if(a==='savenum'){const i=document.getElementById('dnum');state.contacts=Object.assign({},state.contacts,{dilek:(i&&i.value||'').trim()});editNum=false;save();render();return}
 if(a==='copy'){const ta=b.closest('.msg').querySelector('textarea');const done=()=>{b.textContent='Kopyalandı';setTimeout(()=>b.textContent='Mesajı kopyala',1800)};
  try{navigator.clipboard.writeText(ta.value).then(done,()=>{ta.select();b.textContent='Seçildi, kopyala'})}catch(err){ta.select();b.textContent='Seçildi, kopyala'}return}
 if(!m)return;
 if(a==='tick'){const id=b.dataset.s;const st=S.find(x=>x.id===id);const ss=stepState(m,st);if(ss.locked||(m.done[id]&&!ss.undo))return;if(m.done[id])delete m.done[id];else m.done[id]=iso(new Date());save();render();return}
 if(a==='upto'){const i=S.findIndex(s=>s.id===b.dataset.s);S.slice(0,i+1).forEach(s=>{if(!s.kids&&!m.done[s.id])m.done[s.id]=iso(new Date())});save();render();return}
 if(a==='del'){if(confirmDel===m.id){state.months=state.months.filter(x=>x.id!==m.id);confirmDel=null;cur=null;save()}else confirmDel=m.id;render()}});
app.addEventListener('input',e=>{const m=state.months.find(x=>x.id===cur);if(!m)return;
 if(e.target.id==='note'){m.note=e.target.value;save()}});
app.addEventListener('change',e=>{const m=state.months.find(x=>x.id===cur);if(!m)return;
 if(e.target.id==='due'){m.due=e.target.value;save();render()}});
app.addEventListener('submit',e=>{if(e.target.id!=='sform')return;e.preventDefault();
 const v=id=>document.getElementById(id);const t=v('f_t').value.trim();if(!t)return;
 const o={t,h:v('f_h').value.trim(),p:v('f_p').value,g:+v('f_g').value,w:v('f_w').checked,lv:+v('f_lv').value,free:v('f_free').checked,pp:[...document.querySelectorAll('#f_pp .chip')].map(c=>c.dataset.name)};
 const list=own().map(strip);
 if(dlg==='new'){placeInGroup(list,{id:'u'+Date.now().toString(36),ms:'',...o})}
 else{const i=list.findIndex(x=>x.id===dlg);if(i<0)return;const old=list[i];const nw={...old,...o};
  if(nw.g!==old.g){list.splice(i,1);placeInGroup(list,nw)}else list[i]=nw}
 state.steps=list;dlg=null;confirmStep=null;syncSteps();save();render()});
function addPerson(){const i=document.getElementById('f_pnew');const box=document.getElementById('f_pp');if(!i||!box)return;const n=i.value.trim().replace(/\s+/g,' ');if(!n)return;
 if(![...box.querySelectorAll('.chip')].some(c=>c.dataset.name.toLocaleLowerCase('tr')===n.toLocaleLowerCase('tr'))){const w=document.createElement('span');w.className='pp chip';w.dataset.name=n;w.innerHTML=avatar(n)+'<button type="button" class="px" data-act="prm">×</button>';w.querySelector('.px').setAttribute('aria-label',n+' kişisini kaldır');box.appendChild(w)}
 i.value='';i.focus()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&dlg){dlg=null;render();return}if(e.key==='Enter'&&e.target&&e.target.id==='f_pnew'){e.preventDefault();addPerson()}});
const enterEdit=()=>{if(editMode)return;editMode=true;try{navigator.vibrate&&navigator.vibrate(15)}catch(_){}render()};
app.addEventListener('dblclick',e=>{const r=e.target.closest('.row');if(!r||editMode||e.target.closest('textarea,input,a,.msg,.fol'))return;e.preventDefault();anchorId=r.dataset.sid||null;noClickUntil=Date.now()+300;enterEdit()});
let lp=null;
app.addEventListener('pointerdown',e=>{if(editMode||e.pointerType==='mouse')return;const r=e.target.closest('.row');if(!r||e.target.closest('textarea,input,a,.msg,.fol'))return;
 const x=e.clientX,y=e.clientY;lp={x,y,t:setTimeout(()=>{lp=null;anchorId=r.dataset.sid||null;noClickUntil=Date.now()+700;enterEdit()},550)}});
const lpCancel=()=>{if(lp){clearTimeout(lp.t);lp=null}};
app.addEventListener('pointermove',e=>{if(lp&&Math.hypot(e.clientX-lp.x,e.clientY-lp.y)>8)lpCancel()});
app.addEventListener('pointerup',lpCancel);app.addEventListener('pointercancel',lpCancel);
app.addEventListener('contextmenu',e=>{if(e.target.closest('.row')&&!e.target.closest('textarea,input'))e.preventDefault()});
let drag=null;
app.addEventListener('pointerdown',e=>{if(!editMode)return;const h=e.target.closest('.hd');if(!h)return;const row=h.closest('.row');if(!row)return;e.preventDefault();
 try{h.setPointerCapture(e.pointerId)}catch(_){}
 const multi=chosen.has(row.dataset.sid)&&chosen.size>1;const it0=S.find(x=>x.id===row.dataset.sid);const blk=multi?[]:desc(it0).map(x=>x.id);blk.forEach(id=>{const r=app.querySelector(`.row[data-sid="${id}"]`);if(r)r.classList.add('carry')});const dl=document.createElement('div');dl.id='dropline';dl.innerHTML='<span></span>';document.body.appendChild(dl);
 drag={row,h,id:row.dataset.sid,multi,blk,lv0:it0.lv,lv:it0.lv,x0:e.clientX,x:e.clientX,dl,y0:e.clientY,s0:scrollY,y:e.clientY,tgt:null,after:false,raf:0};row.classList.add('drag');if(multi){row.dataset.n=chosen.size+' adım';app.querySelectorAll('.row.pick').forEach(r=>{if(r!==row)r.classList.add('carry')})}document.body.classList.add('dragging');
 const loop=()=>{if(!drag)return;const y=drag.y;if(y<90)scrollBy(0,-14);else if(y>innerHeight-110)scrollBy(0,14);dragMove();drag.raf=requestAnimationFrame(loop)};drag.raf=requestAnimationFrame(loop)});
function dragMove(){const d=drag;d.row.style.transform=`translateY(${d.y-d.y0+(scrollY-d.s0)}px)`;
 let best=null,bd=1e9;for(const r of app.querySelectorAll('.row[data-sid]')){if(r===d.row||(d.multi&&chosen.has(r.dataset.sid))||d.blk.includes(r.dataset.sid))continue;const b=r.getBoundingClientRect();const c=(b.top+b.bottom)/2;const dist=Math.abs(d.y-c);if(dist<bd){bd=dist;best={r,after:d.y>c}}}
 if(!best){d.dl.style.display='none';return}d.tgt=best.r.dataset.sid;d.after=best.after;
 const skip=new Set([d.id,...d.blk,...(d.multi?[...chosen]:[])]);const rest=S.filter(x=>!skip.has(x.id));const ti=rest.findIndex(x=>x.id===d.tgt);const prev=d.after?rest[ti]:rest[ti-1];
 const maxLv=prev?Math.min(2,prev.lv+1):0;const stepW=innerWidth<600?18:28;const want=d.lv0+Math.round((d.x-d.x0)/(stepW*1.3));d.lv=Math.max(0,Math.min(maxLv,want));
 const b=best.r.getBoundingClientRect();const card=best.r.closest('.card');const base=(card?card.getBoundingClientRect().left:b.left)+(innerWidth<600?16:24);const left=base+d.lv*stepW;
 Object.assign(d.dl.style,{display:'block',top:(d.after?b.bottom:b.top)-1+'px',left:left+'px',width:Math.max(40,b.right-left)+'px'});d.dl.querySelector('span').textContent=LVN[d.lv]}
app.addEventListener('pointermove',e=>{if(drag){drag.y=e.clientY;drag.x=e.clientX}});
const dragEnd=()=>{if(!drag)return;const d=drag;anchorId=d.tgt||null;drag=null;cancelAnimationFrame(d.raf);d.dl.remove();document.body.classList.remove('dragging');noClickUntil=Date.now()+250;
 if(d.multi&&d.tgt&&!chosen.has(d.tgt)){const list=own().map(strip);const picked=list.filter(x=>chosen.has(x.id));const rest=list.filter(x=>!chosen.has(x.id));const j=rest.findIndex(x=>x.id===d.tgt);const g=rest[j].g;picked.forEach(x=>{x.g=g;x.lv=d.lv});rest.splice(d.after?j+1:j,0,...picked);state.steps=rest;chosen.clear();syncSteps();save()}
 else if(!d.multi&&d.tgt&&d.tgt!==d.id){const list=own().map(strip);const ids=new Set([d.id,...d.blk]);const block=list.filter(x=>ids.has(x.id));const rest=list.filter(x=>!ids.has(x.id));const j=rest.findIndex(x=>x.id===d.tgt);const g=rest[j].g;const dl=d.lv-d.lv0;block.forEach(x=>{x.g=g;x.lv=Math.max(0,Math.min(2,x.lv+dl))});rest.splice(d.after?j+1:j,0,...block);state.steps=rest;syncSteps();save()}
 render()};
app.addEventListener('pointerup',dragEnd);app.addEventListener('pointercancel',dragEnd);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&timer&&art){clearTimeout(timer);push()}});
let restoreA=null;try{const u=JSON.parse(sessionStorage.getItem(UIK)||'null');if(u){editMode=!!u.e;(u.c||[]).forEach(x=>chosen.add(x));if(Date.now()-u.t<120000){restoreY=u.y;restoreA=u.a||null}}}catch(_){}
render();
if(restoreY!=null){const go=()=>{if(!restoreAnchor(restoreA))scrollTo(0,restoreY)};requestAnimationFrame(go);try{document.fonts&&document.fonts.ready.then(()=>requestAnimationFrame(go))}catch(_){}}
(async()=>{try{if(window.claude&&typeof window.claude.use==='function')art=await window.claude.use('artifact')}catch(e){art=null}
 if(!art){try{const l=JSON.parse(localStorage.getItem(KEY)||'null');if(l&&l.months&&l.updatedAt>(state.updatedAt||0)){state=l;migrate();syncSteps();render()}}catch(e){}
  setSync('Bu cihazda kayıtlı')}else setSync('Telefon ve bilgisayarda eşit')})();
}
